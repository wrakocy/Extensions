name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Wrak.Extensions.slnx

      - name: Verify formatting
        run: dotnet format Wrak.Extensions.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Wrak.Extensions.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wrak.Extensions.Tests/Wrak.Extensions.Tests.csproj -c Release --no-build
